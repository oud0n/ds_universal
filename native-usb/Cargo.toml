[package]
name = "laploupe-usb-host"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[features]
default = []
# 疑似シリアルポート専用。通常のビルドには含めない。
test-port = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4", default-features = false }
