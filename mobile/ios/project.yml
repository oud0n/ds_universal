# Xcode のプロジェクトは、この設定から XcodeGen で作る (.xcodeproj は git に入れない)。
#   brew install xcodegen
#   cd mobile/ios && xcodegen
name: DSUniversal
options:
  bundleIdPrefix: io.github.oud0n
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # 開発中に読み込む Web (Mac の開発サーバー)。空なら公開版のページを読む
    DS_WEB_URL: ""
targets:
  DSUniversal:
    type: application
    platform: iOS
    sources:
      - DSUniversal
    info:
      path: DSUniversal/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.oud0n.dsuniversal
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: DSUniversal/Info.plist
