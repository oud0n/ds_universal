# Xcode のプロジェクトは、この設定から XcodeGen で作る (.xcodeproj は git に入れない)。
#   brew install xcodegen
#   cd mobile/ios && xcodegen
name: DSUniversal
options:
  bundleIdPrefix: io.github.oud0n
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "14"
    # 開発中に読み込む Web (Mac の開発サーバー)。作るときの環境変数で渡す (例: DS_WEB_URL=http://192.168.1.13:5192/ xcodegen)。
    # 空なら公開版のページを読む。IP アドレスは人ごとに違うので、ここには書かない
    # (Mac の開発サーバーを LAN で読むには、Info.plist に NSLocalNetworkUsageDescription が要る。配る版の審査のため外したので、使うときだけ足す)
    DS_WEB_URL: "${DS_WEB_URL}"
    # 署名のチーム (Xcode の Accounts に入れた Apple ID のチーム ID)。作るときの環境変数で渡す (例: DS_TEAM_ID=ABCDE12345 xcodegen)。
    # 人ごとに違うので、ここには書かない
    DEVELOPMENT_TEAM: "${DS_TEAM_ID}"
    CODE_SIGN_STYLE: Automatic
targets:
  DSUniversal:
    type: application
    platform: iOS
    sources:
      - path: DSUniversal
        excludes:
          - Info.plist
      # アプリに入れる Web (npm run build で作った dist をそのまま入れる。BundledWeb.swift が laploupe://app/ で返す)
      - path: ../../dist
        type: folder
        buildPhase: resources
    # アプリに入れる Web (dist) を作り忘れていないかを確かめる (npm run build を先に。古い dist のままにしないこと)
    preBuildScripts:
      - name: Check bundled web (dist)
        script: |
          if [ ! -f "${SRCROOT}/../../dist/index.html" ]; then
            echo "error: dist がありません。リポジトリの直下で npm run build を先に実行してください"
            exit 1
          fi
          VERSION=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' "${SRCROOT}/../../package.json" | head -1)
          if [ "$VERSION" != "${MARKETING_VERSION}" ]; then
            echo "warning: package.json の版 ($VERSION) とアプリの版 (${MARKETING_VERSION}) が違います"
          fi
        basedOnDependencyAnalysis: false
    # 使い方のページの動画 (help/video) はアプリに入れない (19 MB ほどある。アプリの中のページは、公開しているページの動画を開く。help.js)
    postBuildScripts:
      - name: Remove help videos from the bundled web
        script: |
          rm -rf "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/dist/help/video"
        basedOnDependencyAnalysis: false
    # Info.plist は手で書いたものを使う (XcodeGen の info: を使うと、作るたびに上書きされる)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.oud0n.dsuniversal
        # iPhone と iPad (1.1.0 から。iPad は縦が中くらい、横がパソコン向けの配置。docs/duo_layout_design.md)
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: DSUniversal/Info.plist
        # アプリのアイコン (Assets.xcassets/AppIcon。build/icon-ios.svg から作った 1024 の透明のない PNG。角は iOS が丸める)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
