<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DS Universal - GPS Data Logger & Telemetry Analyser</title>
    <!-- アプリアイコン (build/icon.svg / icon.png から作成)。ブラウザ版はサブパスで公開するので相対パスで参照する -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <script>
      // 画面が描かれる前にテーマを決める (保存した設定、なければ OS の設定)。src/utils/theme.ts と同じ決め方
      try {
        var t = localStorage.getItem('ds_theme');
        var dark = t === 'dark' || (t !== 'light' && !window.matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.classList.add(dark ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body class="bg-surface-0 text-slate-100 antialiased selection:bg-red-500 selection:text-white select-none overflow-hidden h-dvh w-screen">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
