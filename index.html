<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>LapLoupe — Lap / Track Analyzer（デジスパイス対応の走行ログ解析）</title>
    <meta name="description" content="LapLoupe（ラップルーペ、旧名 DS Universal）は、デジスパイスなどの GPS ロガーの走行ログを、Mac・Windows・ブラウザ・スマートフォンで解析するアプリです。ラップ・セクタータイム、走行ライン、車速・G の比較、GoPro 車載動画との同期。インストール不要で、ログはこの端末の中だけで読み込みます。" />
    <meta name="application-name" content="LapLoupe" />
    <meta name="apple-mobile-web-app-title" content="LapLoupe" />
    <!-- アプリアイコン (build/icon.svg / icon.png から作成)。ブラウザ版はサブパスで公開するので相対パスで参照する -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <script>
      // 画面が描かれる前にテーマを決める (保存した設定、なければ OS の設定)。src/utils/theme.ts と同じ決め方
      try {
        var t = localStorage.getItem('ds_theme');
        var dark = t === 'dark' || (t !== 'light' && t !== 'contrast' && !window.matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.classList.add(dark ? 'dark' : 'light');
        if (t === 'contrast') document.documentElement.classList.add('contrast');
      } catch (e) {
        document.documentElement.classList.add('dark');
      }
    </script>
  </head>
  <body class="bg-surface-0 text-slate-100 antialiased selection:bg-red-500 selection:text-white select-none overflow-hidden h-dvh w-screen">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
