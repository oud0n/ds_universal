<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DigSpice Universal Tool</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Header -->
  <header>
    <div class="logo-area">
      <span class="logo-title">DigSpice Universal</span>
      <span class="logo-tag">IV Control</span>
    </div>
    <div class="connection-bar">
      <div id="statusBadge" class="status-badge disconnected">
        <span class="status-dot"></span>
        <span id="statusText">未接続 (Disconnected)</span>
      </div>
      <button id="btnConnect" class="btn btn-primary">🔌 デバイスに接続</button>
      <button id="btnDisconnect" class="btn btn-secondary" style="display: none;">切断</button>
    </div>
  </header>

  <!-- Main Container -->
  <div class="app-container">
    <!-- Left Column: Controls & Information -->
    <div class="left-panel">
      <!-- Device Configuration Card -->
      <div class="card">
        <div class="card-title">
          <span>デバイス情報 (Device Info)</span>
          <button id="btnRefreshConfig" class="btn btn-secondary btn-sm" disabled>🔄 再取得</button>
        </div>
        <div class="info-grid">
          <div class="info-item">
            <div class="info-label">モデル / FW</div>
            <div id="valFwVersion" class="info-value">--</div>
          </div>
          <div class="info-item">
            <div class="info-label">記録レート</div>
            <div id="valLogRate" class="info-value">--</div>
          </div>
          <div class="info-item">
            <div class="info-label">開始/停止速度</div>
            <div id="valStartSpeed" class="info-value">--</div>
          </div>
          <div class="info-item">
            <div class="info-label">内部ステータス</div>
            <div id="valDeviceStatus" class="info-value">--</div>
          </div>
          <div class="info-item full-width">
            <div class="info-label">次回書き込みアドレス / 記録容量</div>
            <div id="valWritePointer" class="info-value">--</div>
          </div>
        </div>
      </div>

      <!-- Settings Card -->
      <div class="card">
        <div class="card-title">設定変更 (Settings)</div>

        <!-- Rate Setting -->
        <div class="control-group">
          <label class="control-label">ログ記録レート (Fix Rate)</label>
          <div class="button-row">
            <button class="btn btn-secondary btn-rate" data-rate="20" disabled>20 Hz (50ms)</button>
            <button class="btn btn-secondary btn-rate" data-rate="10" disabled>10 Hz (100ms)</button>
            <button class="btn btn-secondary btn-rate" data-rate="5" disabled>5 Hz (200ms)</button>
          </div>
        </div>

        <!-- Speed Setting -->
        <div class="control-group">
          <label class="control-label">ログ自動記録 開始/停止 速度閾値 (km/h)</label>
          <div class="button-row" style="margin-bottom: 8px;">
            <button class="btn btn-secondary btn-preset-speed" data-speed="10" disabled>10</button>
            <button class="btn btn-secondary btn-preset-speed" data-speed="20" disabled>20</button>
            <button class="btn btn-secondary btn-preset-speed" data-speed="30" disabled>30</button>
            <button class="btn btn-secondary btn-preset-speed" data-speed="35" disabled>35</button>
          </div>
          <div class="button-row">
            <input type="number" id="inputCustomSpeed" class="input-number" min="1" max="250" value="30" disabled>
            <button id="btnApplySpeed" class="btn btn-primary btn-sm" disabled>速度設定を適用</button>
          </div>
        </div>
      </div>

      <!-- Log Operations Card -->
      <div class="card">
        <div class="card-title">ログ操作 (Data Operations)</div>

        <!-- Download -->
        <div class="control-group">
          <label class="control-label">本体データのダウンロード</label>
          <button id="btnDownload" class="btn btn-primary" style="width: 100%;" disabled>
            📥 ログデータをダウンロード (.bin保存)
          </button>
          <div id="downloadProgressContainer" class="progress-container">
            <div class="progress-bar-bg">
              <div id="downloadProgressBar" class="progress-bar-fill"></div>
            </div>
            <div class="progress-text">
              <span id="downloadStatusText">準備中...</span>
              <span id="downloadPercentText">0%</span>
            </div>
          </div>
        </div>

        <hr style="border: 0; border-top: 1px solid var(--card-border); margin: 16px 0;">

        <!-- Erase -->
        <div class="control-group">
          <label class="control-label" style="color: #f87171;">本体ログ全消去 (Flash Memory Erase)</label>
          <div class="erase-confirm-box">
            <input type="checkbox" id="chkConfirmErase">
            <label for="chkConfirmErase">ログ消去を許可する（元に戻せません）</label>
          </div>
          <button id="btnErase" class="btn btn-danger" style="width: 100%;" disabled>
            🗑️ 保存ログを全消去
          </button>
        </div>
      </div>
    </div>

    <!-- Right Column: Live Terminal Log -->
    <div class="right-panel">
      <div class="terminal-card">
        <div class="terminal-header">
          <span class="terminal-title">SERIAL COMMUNICATION LOG (115200 8N1)</span>
          <div class="terminal-actions">
            <label style="font-size: 0.75rem; color: #94a3b8; display: flex; align-items: center; gap: 4px; cursor: pointer;">
              <input type="checkbox" id="chkAutoScroll" checked> 自動スクロール
            </label>
            <button id="btnClearLog" class="btn btn-secondary btn-sm">ログ消去</button>
          </div>
        </div>
        <div id="terminalBody" class="terminal-body">
          <div class="log-entry">
            <span class="log-time">[System]</span>
            <span class="log-dir sys">SYS</span>
            <span class="log-text">DigSpice Universal Tool ready. Connect your DigSpice IV via USB.</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
