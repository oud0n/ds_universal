name: Build & Release (Windows / macOS)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      notarize:
        description: 'Mac 版を公証する (タグでは自動で公証する)'
        type: boolean
        default: false

# 既定は読み取りのみ。リリースを作るジョブだけに書き込み権限を与える
permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_cmd: npm run dist:win
            artifact_pattern: |
              release/*.exe
              release/*.zip
          - os: macos-latest
            target_cmd: npm run dist:mac
            artifact_pattern: |
              release/*.dmg
              release/*.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check & Vite build
        run: npm run build

      - name: Build Electron Package (Windows)
        if: matrix.os == 'windows-latest'
        run: ${{ matrix.target_cmd }}

      # Mac 版: Secrets に Developer ID の証明書があれば署名し、タグ (または手動で notarize を選んだとき) は公証もする。
      # Secrets がないとき (フォークなど) は、これまでどおり署名なしで作る
      - name: Build Electron Package (macOS)
        if: matrix.os == 'macos-latest'
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID_VALUE: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_VALUE: ${{ secrets.APPLE_API_ISSUER }}
          NOTARIZE: ${{ startsWith(github.ref, 'refs/tags/') || inputs.notarize == true }}
        run: |
          if [ -n "$MAC_CERT_P12_BASE64" ]; then
            export CSC_LINK="$MAC_CERT_P12_BASE64"
            export CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
            echo "Developer ID で署名します"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "証明書がないので、署名しません"
          fi
          if [ "$NOTARIZE" = "true" ] && [ -n "$APPLE_API_KEY_P8" ] && [ -n "$MAC_CERT_P12_BASE64" ]; then
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
            export APPLE_API_KEY_ID="$APPLE_API_KEY_ID_VALUE"
            export APPLE_API_ISSUER="$APPLE_API_ISSUER_VALUE"
            echo "公証します"
          fi
          ${{ matrix.target_cmd }}

      - name: Check macOS signature
        if: matrix.os == 'macos-latest'
        run: |
          APP=$(ls -d release/mac-arm64/*.app)
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E 'Authority|TeamIdentifier' || true
          spctl -a -vv -t exec "$APP" 2>&1 || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          path: ${{ matrix.artifact_pattern }}
          if-no-files-found: error

  release:
    name: Release to GitHub
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: artifacts-*
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -la release-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          draft: false
          # v1.2.3-rc.1 のようにハイフンを含むタグはプレリリースとして公開する
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
