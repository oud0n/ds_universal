name: Build & Release (Windows / macOS)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      notarize:
        description: 'Mac 版を公証する (タグでは自動で公証する)'
        type: boolean
        default: false

# 既定は読み取りのみ。リリースを作るジョブだけに書き込み権限を与える
permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_cmd: npm run dist:win
            artifact_pattern: |
              release/*.exe
              release/*.zip
          - os: macos-latest
            target_cmd: npm run dist:mac
            artifact_pattern: |
              release/*.dmg
              release/*.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check & Vite build
        run: npm run build

      - name: Build Electron Package (Windows)
        if: matrix.os == 'windows-latest'
        run: ${{ matrix.target_cmd }}

      # Mac 版: Secrets に Developer ID の証明書があれば署名し、タグ (または手動で notarize を選んだとき) は公証もする。
      # Secrets がないとき (フォークなど) は、これまでどおり署名なしで作る
      - name: Build Electron Package (macOS)
        if: matrix.os == 'macos-latest'
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID_VALUE: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_VALUE: ${{ secrets.APPLE_API_ISSUER }}
          NOTARIZE: ${{ startsWith(github.ref, 'refs/tags/') || inputs.notarize == true }}
        run: |
          # 途中で失敗しても、鍵の入ったファイルを残さない
          trap 'rm -f "$RUNNER_TEMP/pem.pem" "$RUNNER_TEMP/in.p12" "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8"' EXIT
          if [ -n "$MAC_CERT_P12_BASE64" ]; then
            # キーチェーンアクセスが書き出した .p12 は古い暗号 (RC2) で、CI の OpenSSL 3 は -legacy でないと読めない。
            # どの macOS の security でも読める形 (3DES・SHA1) に入れ直してから使う
            printf '%s' "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/in.p12"
            openssl pkcs12 -legacy -in "$RUNNER_TEMP/in.p12" -info -noout -passin env:MAC_CERT_PASSWORD 2>&1 | grep -viE 'bag attributes|localKeyID|friendlyName' || true
            openssl pkcs12 -legacy -in "$RUNNER_TEMP/in.p12" -nodes -passin env:MAC_CERT_PASSWORD -out "$RUNNER_TEMP/pem.pem"
            openssl pkcs12 -export -in "$RUNNER_TEMP/pem.pem" -out "$RUNNER_TEMP/cert.p12" -passout env:MAC_CERT_PASSWORD \
              -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg sha1
            echo "keys in p12: $(grep -c "PRIVATE KEY-----" "$RUNNER_TEMP/pem.pem" || true), certs: $(grep -c "BEGIN CERTIFICATE" "$RUNNER_TEMP/pem.pem" || true)"
            rm -f "$RUNNER_TEMP/pem.pem" "$RUNNER_TEMP/in.p12"
            # 署名用のキーチェーンを自分で作る (electron-builder に任せると、鍵に使用の許可を付ける段階で失敗したため)
            KC="$RUNNER_TEMP/signing.keychain-db"
            KC_PW="$(openssl rand -hex 16)"
            security create-keychain -p "$KC_PW" "$KC"
            security set-keychain-settings -lut 21600 "$KC"
            security unlock-keychain -p "$KC_PW" "$KC"
            security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" > /dev/null
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
            security find-identity -v -p codesigning "$KC" | tail -1
            rm -f "$RUNNER_TEMP/cert.p12"
            export CSC_NAME="$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*"Developer ID Application: \(.*\)"/\1/p' | head -1)"
            export CSC_KEYCHAIN="$KC"
            echo "Developer ID で署名します"
          else
            # タグ (リリース) で証明書が無いときは止める (署名なしのものをリリースに上げない)
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "::error::リリースのタグなのに、署名の証明書 (MAC_CERT_P12_BASE64) がありません"; exit 1; fi
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "証明書がないので、署名しません"
          fi
          if [ "$NOTARIZE" = "true" ] && [ -n "$APPLE_API_KEY_P8" ] && [ -n "$MAC_CERT_P12_BASE64" ]; then
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
            export APPLE_API_KEY_ID="$APPLE_API_KEY_ID_VALUE"
            export APPLE_API_ISSUER="$APPLE_API_ISSUER_VALUE"
            echo "公証します"
          fi
          ${{ matrix.target_cmd }}

      # タグ (リリース) のときは、署名か公証が通っていなければ止める (署名なし・公証なしのものをリリースに上げない)
      - name: Check macOS signature
        if: matrix.os == 'macos-latest'
        env:
          HAS_CERT: ${{ secrets.MAC_CERT_P12_BASE64 != '' }}
        run: |
          APP=$(ls -d release/mac-arm64/*.app)
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E 'Authority|TeamIdentifier' || true
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [ "$HAS_CERT" = "true" ]; then
            codesign --verify --deep --strict "$APP"
            spctl -a -vv -t exec "$APP"
          else
            spctl -a -vv -t exec "$APP" 2>&1 || true
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          path: ${{ matrix.artifact_pattern }}
          if-no-files-found: error

  release:
    name: Release to GitHub
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: artifacts-*
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -la release-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          draft: false
          # v1.2.3-rc.1 のようにハイフンを含むタグはプレリリースとして公開する
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
