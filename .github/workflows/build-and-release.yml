name: Build & Release Multiplatform

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target_cmd: npm run dist:win
            artifact_pattern: |
              release/*.exe
          - os: macos-latest
            target_cmd: npm run dist:mac
            artifact_pattern: |
              release/*.dmg
              release/*.zip
          - os: ubuntu-latest
            target_cmd: npm run dist:linux
            artifact_pattern: |
              release/*.AppImage
              release/*.deb

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check & Vite build
        run: npm run build

      - name: Build Electron Package
        run: ${{ matrix.target_cmd }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          path: ${{ matrix.artifact_pattern }}
          if-no-files-found: error

  release:
    name: Release to GitHub
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: artifacts-*
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -la release-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
